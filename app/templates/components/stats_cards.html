<div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
    <div class="bg-white overflow-hidden shadow rounded-lg border border-gray-200">
        <div class="p-5">
            <div class="flex items-center">
                <div class="flex-shrink-0 bg-yellow-500 text-white rounded-md p-3 font-bold text-lg">⚠</div>
                <div class="ml-5 w-0 flex-1">
                    <dl>
                        <dt class="text-sm font-medium text-gray-500 truncate">Aprobación Pendiente</dt>
                        <dd class="text-2xl font-semibold text-gray-900">{{ pending_count }}</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white overflow-hidden shadow rounded-lg border border-gray-200">
        <div class="p-5">
            <div class="flex items-center">
                <div class="flex-shrink-0 bg-green-500 text-white rounded-md p-3 font-bold text-lg">⚡</div>
                <div class="ml-5 w-0 flex-1">
                    <dl>
                        <dt class="text-sm font-medium text-gray-500 truncate">Respuestas Despachadas</dt>
                        <dd class="text-2xl font-semibold text-gray-900">{{ sent_count }}</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white overflow-hidden shadow rounded-lg border border-gray-200">
        <div class="p-5">
            <div class="flex items-center">
                <div class="flex-shrink-0 bg-indigo-500 text-white rounded-md p-3 font-bold text-lg">📨</div>
                <div class="ml-5 w-0 flex-1">
                    <dl>
                        <dt class="text-sm font-medium text-gray-500 truncate">Total Procesados</dt>
                        <dd class="text-2xl font-semibold text-gray-900">{{ total_count }}</dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>
</div>
