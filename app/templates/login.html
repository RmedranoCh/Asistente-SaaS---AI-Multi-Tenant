<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - SaaS AI</title>
    <link rel="stylesheet" href="/static/css/dist.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-200 w-full max-w-md space-y-6">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-gray-900">Ingresar al Sistema</h2>
            <p class="text-xs text-gray-400 mt-1">Acceso seguro para empresas aliadas.</p>
        </div>
        <form action="/dashboard" method="GET" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Correo Corporativo</label>
                <input type="email" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Contraseña</label>
                <input type="password" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-2.5 rounded-lg text-sm transition">
                Iniciar Sesión
            </button>
        </form>
    </div>
</body>
</html>
